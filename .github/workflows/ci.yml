name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # v2 unit tests — OS-portable, no live X session / no real login.
  # Runs the portability layer's unit tests on all three desktop OSes.
  unit-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run cookie-store unit tests
        run: python3 tests/test_cookie_store.py

      - name: Run config unit tests
        run: python3 tests/test_config.py

      - name: Run cdp-launcher unit tests
        run: python3 tests/test_cdp_launcher.py

      # The plugin layer's hermes-free battery (they need only stdlib +
      # the repo: the register() recording-stub contract, the llm
      # fallback law, the paths seam, the grep-gate, the settings
      # precedence). test_harvest_driver / test_skills_out /
      # test_settings' schema classes need a hermes checkout
      # (HAVE_HERMES) — they run in the local admission gate, not here.
      - name: Run the paths-seam unit tests
        run: python3 tests/test_reapx_paths.py

      - name: Run the register-contract unit tests
        run: python3 tests/test_plugin_surface.py

      - name: Run the llm-fallback unit tests
        run: python3 tests/test_llm_fallback.py

      - name: Run the settings unit tests
        run: python3 tests/test_settings.py

      - name: Run the forbidden-strings gate
        run: python3 tests/test_grep_gate.py

  # v1 pipeline smoke test (no browser / no live session needed) — kept.
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run smoke test
        # Any assertion failure makes smoke_test.py exit non-zero -> job fails.
        run: python3 tests/smoke_test.py

  # The plugin admission gates (the catalog CI runs the same checks; this
  # job keeps the tree honest between catalog runs): the 16 `hermes
  # plugins validate` checks + the doctor's isolated load.
  # NOTE (build mission, local-git-only): no GitHub runner was available
  # in the build — the hermes-agent install line is the documented pip
  # name and the validate/doctor invocations are the exact commands the
  # local admission gate ran (exit 0). If the install name ever differs,
  # fix it in the same PR that first runs this job.
  plugins-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install hermes-agent
        run: pip install hermes-agent

      - name: Validate the plugin (the 16 admission checks)
        run: hermes plugins validate .

      - name: Doctor (the isolated load)
        run: hermes plugins doctor .
