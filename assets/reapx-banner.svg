<svg width="1200" height="400" viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0f1e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#111b33;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="harvestGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#34d399;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#22d3ee;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
    </filter>
  </defs>

  <rect width="1200" height="400" fill="url(#bgGradient)" />

  <!-- Ambient harvest glow (top-left) -->
  <circle cx="260" cy="120" r="220" fill="#34d399" opacity="0.10" filter="url(#softGlow)" />
  <!-- Ambient X-blue glow (bottom-right) -->
  <circle cx="1000" cy="320" r="240" fill="#22d3ee" opacity="0.08" filter="url(#softGlow)" />

  <!-- Emblem: stylized bookmark/scythe-hook marking "harvest" -->
  <g transform="translate(205,200)">
    <!-- Sickle / harvest hook -->
    <path d="M -60 55 A 95 95 0 1 1 55 -60 L 70 -60 L 70 -45 L 58 -45 A 80 80 0 1 0 -45 58 Z"
          fill="url(#harvestGrad)" filter="url(#glow)" opacity="0.95" />
    <!-- Grain stalks -->
    <line x1="-8" y1="55" x2="-8" y2="18" stroke="#34d399" stroke-width="3" opacity="0.85" />
    <line x1="8"  y1="55" x2="8"  y2="18" stroke="#34d399" stroke-width="3" opacity="0.85" />
    <line x1="0"  y1="55" x2="0"  y2="22" stroke="#22d3ee" stroke-width="3" opacity="0.85" />
    <circle cx="-8" cy="12" r="6" fill="#34d399" opacity="0.9" />
    <circle cx="8"  cy="12" r="6" fill="#34d399" opacity="0.9" />
    <circle cx="0"  cy="16" r="6" fill="#22d3ee" opacity="0.9" />
  </g>

  <!-- Title -->
  <text x="290" y="195" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="bold" fill="#ffffff" opacity="0.95">ReapX</text>

  <!-- Tagline -->
  <text x="290" y="240" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#a7f3d0" opacity="0.9">Harvest what you saved on X</text>
  <text x="290" y="272" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#8fa1c0" opacity="0.85">bookmarks → reusable AI skills · no paid X API</text>
</svg>
