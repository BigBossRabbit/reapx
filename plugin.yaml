# plugin.yaml — ReapX (manifest v2)
name: reapx
version: 1.0.0                 # matches the pinned code + the catalog entry's quoted version
manifest_version: 2
api_version: 1
license: MIT
author: BigBossRabbit
homepage: https://github.com/BigBossRabbit/reapx
tags: [skills, x, bookmarks, export, automation]

description: >-
  Turn X (Twitter) bookmarks into ready-to-load Hermes skills. The plugin takes
  bookmark DATA, never a browser session: an inline array the agent collected
  with Hermes's own browser tool (with the user's consent), or a bookmarks file
  the user points at — the plugin itself reads no cookie store and needs no X
  API key. Incremental via a persistent seen-ledger, two-track assessed
  (integrate-into-makeup + business-opportunity), with optional LLM enrichment
  of the map / categorize / assess stages through the host (ctx.llm) — zero
  keys, zero credentials in the plugin, and a deterministic rules fallback.
  Skills land in reapx_review first; registering them is a setting, off by
  default.

# R06: must list EXACTLY what register() registers (hermes plugins validate
# fails the entry otherwise; "N tools" chips come from here).
provides_tools:
  - reapx_import
  - reapx_status
  - reapx_review

provides_hooks: []             # v1 registers no hooks

# R14: honest SemVer floor — the oldest hermes-agent this was validated
# against (plugin_llm ctx.llm incl. register_auxiliary_task, manifest v2,
# config_schema settings forms, register_skill namespacing). Same value goes
# in the catalog entry plugin-catalog/reapx.yaml.
requires_hermes: ">=0.22.6"

# R11: ReapX needs NO credentials at all. No requires_env. The plugin reads no
# browser profile, no keychain, no .env. The LLM runs host-owned via ctx.llm.
# This field is intentionally absent.

# R10: floors + upper bounds; the PLUGIN-path subset only. NOTE vs
# requirements.txt (the STANDALONE list): websocket-client, PyYAML, requests
# and cryptography belong to the standalone browser scripts, which the plugin
# never imports. The plugin path needs exactly jinja2 (generate_skills).
python_dependencies:
  - "jinja2>=3.0,<4"           # templating (generate_skills)

# Every setting lands in plugins.entries.reapx.settings.* and renders as the
# Desktop Settings form. These are read from the plugin CONFIG ONLY — a tool
# call cannot change them.
config_schema:
  import_dir:
    type: str
    default: ""
    label: Import directory
    description: >-
      Default directory reapx_import reads x_bookmarks.json from when no
      path/items is passed (the file a scheduled run uses). Empty = no
      default; then a call must supply path or items.
  enrich:
    type: str
    choices: [llm, rules]
    default: llm
    label: Enrichment engine
    description: >-
      llm = the map / categorize / assess stages run through the host LLM
      (ctx.llm — your active provider and model, host-owned credentials, no
      keys in this plugin) with the rules engine as fallback; rules = the
      deterministic keyword engine only (zero LLM calls).
  llm_max_items:
    type: int
    default: 50
    label: LLM items per run
    description: >-
      Per-run cap on items sent for LLM enrichment (a token-spend guard).
      Items beyond the cap — and everything whenever the LLM call fails —
      fall back to the rules engine. 0 disables LLM enrichment entirely.
  generate_limit:
    type: int
    default: 5
    label: Skills per category per run
    description: >-
      Max skills generated per category per run (top by score). A single call
      may lower this (its generate_limit arg), never raise it. 0 =
      assess-only without generating skills.
  register_generated_skills:
    type: bool
    default: false
    label: Register generated skills
    description: >-
      Register generated skills with the agent (namespaced reapx:<name>,
      loaded with skill_view). Off by default: skill bodies come from other
      people's tweets, so they land in reapx_review first. If false, files
      are still written and reviewable, just not registered.
